
set -g status on
set -g status-position top

# Alte, unpraktische Bindings entfernen
unbind '"'
unbind %

# Vertikal split (links / rechts)
bind v split-window -h

# Horizontal split (oben / unten)
bind s split-window -v

# Terminal / Truecolor
# set -g default-terminal "tmux-256color"
# set -g terminal-overrides ',xterm-256color:Tc'

# Statusbar (modern)
# set -g status-style "bg=#3D3D3D fg=#EBDBB2"


# panel indexing starting at 1
set -g base-index 1 # start windows numbering at 1

#alternatef prefix/leader
unbind C-b
set -g prefix C-s
bind C-s send-prefix
#set -g prefix C-Space
#bind C-Space send-prefix

# Pane-Navigation per Ctrl + H/J/K/L ohne Prefix
bind -n C-h select-pane -L
bind -n C-j select-pane -D
bind -n C-k select-pane -U
bind -n C-l select-pane -R

# clear
bind l send-keys "clear" Enter


#copy mode
unbind [
bind q copy-mode


# Copy-Mode Vim-Tasten
setw -g mode-keys vi

# Visuelle Auswahl starten
bind-key -T copy-mode-vi v send-keys -X begin-selection

# Auswahl kopieren
bind-key -T copy-mode-vi y send-keys -X copy-selection


# Pane-Resize mit Ctrl + Pfeiltasten
bind -n C-Left  resize-pane -L 5
bind -n C-Right resize-pane -R 5
bind -n C-Up    resize-pane -U 5
bind -n C-Down  resize-pane -D 5


# p for pase and b vor previous window
unbind -T prefix p
unbind -T prefix ]

bind -T prefix b previous-window

set -g set-clipboard on
unbind-key -T copy-mode C-p
# Prefix + p → System-Clipboard einfügen
bind-key -n C-p run-shell 'xclip -o -selection clipboard | tmux load-buffer - && tmux paste-buffer'




unbind r
bind r source-file ~/.tmux.conf


# Tmux Plugin manager


# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

# Other examples:
# set -g @plugin 'github_username/plugin_name'
# set -g @plugin 'github_username/plugin_name#branch'
# set -g @plugin 'git@github.com:user/plugin'
# set -g @plugin 'git@bitbucket.com:user/plugin'

# set -g @plugin 'catppuccin/tmux#v2.3.0' # See https://github.com/catppuccin/tmux/tags for additional tags
# # ...alongside
# set -g @plugin 'tmux-plugins/tpm'
#
#
#
# Kanagawa #
 set -g @plugin 'catgoose/kanagawa-tmux'


# Autoinstall TPM
if "test ! -d ~/.tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && ~/.tmux/plugins/tpm/bin/install_plugins'"
run '~/.tmux/plugins/tpm/tpm'


# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
